name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release (appends -pr-<sha> to the tag)'
        required: false
        default: true
        type: boolean

jobs:
  setup:
    name: Resolve Version & Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Resolve tag and check existence
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              SHORT_SHA=$(git rev-parse --short HEAD)
              TAG="v${{ inputs.version }}-pr-${SHORT_SHA}"
            else
              TAG="v${{ inputs.version }}"
            fi
            PRERELEASE=${{ inputs.prerelease }}
            SKIP=false
          else
            TAG="v$(cat VERSION.txt)"
            PRERELEASE=false
            if git ls-remote --tags origin "${TAG}" | grep -q .; then
              echo "Tag ${TAG} already exists - skipping."
              SKIP=true
            else
              SKIP=false
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "skip=${SKIP}" >> $GITHUB_OUTPUT

  publish:
    name: Publish Release
    needs: setup
    if: needs.setup.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.setup.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section for this version
        run: |
          VERSION_NUM="${VERSION#v}"
          VERSION_NUM="${VERSION_NUM%%-pr-*}"
          awk -v ver="[$VERSION_NUM]" '
            !found && index($0, "## " ver) == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "_No CHANGELOG.md entry found for $VERSION._" > release-notes.md
          fi

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          prerelease: ${{ needs.setup.outputs.prerelease }}
          draft: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ env.VERSION }}" --draft=false --repo "${{ github.repository }}"
