name: CI - Release Branch

on:
  pull_request:
    branches:
      - master

jobs:
  verify-version:
    name: Verify Version Tag Is Available
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Check version tag is not yet taken
        run: |
          VERSION="v$(cat VERSION.txt)"
          if git ls-remote --tags origin "${VERSION}" | grep -q "${VERSION}"; then
            echo "ERROR: Tag ${VERSION} already exists. Bump VERSION.txt (and .claude-plugin/plugin.json's version to match) before merging to master."
            exit 1
          fi
          echo "Tag ${VERSION} is available."

      - name: Check plugin.json version matches VERSION.txt
        run: |
          VERSION=$(cat VERSION.txt)
          PLUGIN_VERSION=$(jq -r .version .claude-plugin/plugin.json)
          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "ERROR: VERSION.txt ($VERSION) and .claude-plugin/plugin.json's version ($PLUGIN_VERSION) don't match. Keep them in sync."
            exit 1
          fi

  test:
    name: Dependency Check & Test Suites
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pandoc
        shell: bash
        run: choco install pandoc -y

      - name: Install Python dependencies
        shell: bash
        run: python -m pip install python-docx "docxcompose>=2.2.0" "pyyaml>=6.0" pymupdf jinja2

      - name: Check dependencies
        shell: bash
        run: |
          python skills/dilon-document-compiler/scripts/check_deps.py
          python skills/dilon-document-extractor/scripts/check_deps.py

      - name: Run writer/compiler tests
        shell: bash
        run: python tests/run_tests.py

      - name: Run form-compiler/form-writer tests
        shell: bash
        run: python tests/run_form_tests.py

      - name: Run extractor tests
        shell: bash
        run: python tests/run_extractor_tests.py
